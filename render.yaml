services:
  - type: web
    name: cysecsphere-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: NODE_ENV
        value: "production"
      - key: CORS_ORIGIN
        value: "*" # change this to your deployed frontend's URL after it's live
      # Supabase — the app's database (data.db.json equivalent) and file storage.
      # Create a free project at https://supabase.com, then set these in the
      # Render dashboard (they're marked sync:false so secrets stay out of git):
      #   SUPABASE_URL              — Project Settings → API → Project URL
      #   SUPABASE_SERVICE_ROLE_KEY — Project Settings → API → secret key
      #
      # One-time setup: run this SQL in the Supabase SQL Editor so the app can
      # store its data (only needed if you don't provide DATABASE_URL):
      #   CREATE TABLE IF NOT EXISTS cysec_data (key text PRIMARY KEY, value jsonb NOT NULL);
      #
      # Optional: DATABASE_URL (Postgres connection string) makes the app create
      # the table automatically, but requires an IPv4-reachable connection
      # (direct connections are IPv6-only unless the paid IPv4 add-on is on).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
    # No persistent disk needed — all data and uploads live in Supabase.
